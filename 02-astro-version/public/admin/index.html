<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>JINA SERVICE — ระบบจัดการเนื้อหาหลังบ้าน (Admin CMS)</title>
  <link rel="icon" href="/favicon-dark.ico" />
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    /* =====================================================================
       JINA SERVICE ADMIN PORTAL CUSTOM STYLES
       ===================================================================== */

    /* 1. Logo มุมซ้ายบน: ขนาดใหญ่ขึ้น คมชัด เด่นสง่าพร้อมแสงเรืองมรกต */
    header img.logo,
    img.logo {
      width: 44px !important;
      height: 44px !important;
      max-width: none !important;
      max-height: none !important;
      object-fit: contain !important;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6)) drop-shadow(0 0 12px rgba(0, 245, 155, 0.45)) !important;
      border-radius: 50% !important;
      transition: transform 0.2s ease !important;
    }
    header button:has(img.logo) {
      width: auto !important;
      height: auto !important;
      padding: 4px 6px !important;
    }
    header button:has(img.logo):hover img.logo {
      transform: scale(1.08) !important;
    }

    /* 2. User Profile มุมขวาบน: ขยายใหญ่ขึ้น มีกรอบและเงาสวยงาม เด่น อ่านง่าย */
    header button.avatar,
    header button:has(.avatar),
    header button:has([data-icon="account_circle"]) {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 4px 10px !important;
      border-radius: 9999px !important;
      background: rgba(18, 36, 29, 0.85) !important;
      border: 1.5px solid #00f59b !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 14px rgba(0, 245, 155, 0.4) !important;
      transition: all 0.2s ease !important;
      margin-left: 8px !important;
      cursor: pointer !important;
    }
    header button.avatar:hover,
    header button:has(.avatar):hover {
      background: rgba(0, 245, 155, 0.2) !important;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 245, 155, 0.6) !important;
      transform: translateY(-1.5px) scale(1.05) !important;
    }
    .avatar,
    img.avatar {
      width: 38px !important;
      height: 38px !important;
      border-radius: 50% !important;
      object-fit: cover !important;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5) !important;
    }
    header [data-icon="account_circle"] {
      font-size: 36px !important;
      width: 36px !important;
      height: 36px !important;
      color: #00f59b !important;
      filter: drop-shadow(0 0 8px rgba(0, 245, 155, 0.5)) !important;
    }

    /* 3. ซ่อนแบนเนอร์แจ้งเตือน "Give it a try / Sveltia CMS is now available on mobile!" ด้านบน */
    [style*="--sui-infobar-message-justify-content"],
    .infobar:has(button[aria-label*="Give it a try"]),
    .infobar:has(button:not([aria-label])):has(span) {
      display: none !important;
    }

    /* URL จริงของ section ที่กำลังแก้ (กลางด้านบน) — แก้ path หลังโดเมนได้ */
    #jina-live-url {
      --lu-fg: #1f2937; --lu-bd: rgba(0,0,0,.2); --lu-bg: rgba(0,0,0,.04);
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 9998; display: flex; align-items: center; gap: 2px;
      max-width: calc(100vw - 560px); padding: 4px 6px 4px 12px;
      border: 1px solid var(--lu-bd); border-radius: 8px; background: var(--lu-bg);
      font: 600 15px 'Prompt', 'Kanit', system-ui, sans-serif; color: var(--lu-fg);
    }
    @media (prefers-color-scheme: dark) { #jina-live-url { --lu-fg: #e5ece8; --lu-bd: rgba(255,255,255,.22); --lu-bg: rgba(255,255,255,.06); } }
    #jina-live-url[hidden] { display: none; }
    #jina-live-url .lu-host { white-space: nowrap; opacity: .75; }
    #jina-live-url input {
      min-width: 90px; width: 22ch; padding: 3px 6px; border: 0; border-radius: 5px;
      background: transparent; color: inherit; font: inherit; outline: none;
    }
    #jina-live-url input:focus { background: var(--lu-bg); box-shadow: 0 0 0 1px var(--lu-bd); }
    #jina-live-url a { padding: 3px 8px; border-radius: 5px; color: inherit; text-decoration: none; white-space: nowrap; font-size: 13px; }
    #jina-live-url a:hover { background: var(--lu-bg); }
    @media (max-width: 1100px) { #jina-live-url { display: none; } }

    /* 6. Preview Panel Styles */
    .preview {
      font-family: 'Prompt', 'Kanit', system-ui, -apple-system, sans-serif !important;
      line-height: 1.6 !important;
      color: #e2e8f0 !important;
    }
    .preview h1, .preview h2, .preview h3, .preview h4 {
      color: #22c55e !important;
      font-weight: 700 !important;
      margin-top: 1rem !important;
      margin-bottom: 0.5rem !important;
    }
    .preview strong, .preview b {
      color: #4ade80 !important;
    }
    .preview a {
      color: #38bdf8 !important;
      text-decoration: underline !important;
    }
  </style>
</head>
<body>
  <div id="jina-live-url" hidden><span class="lu-host"></span><input type="text" spellcheck="false" aria-label="path ของลิงก์ (แก้ได้)" /><a href="#" target="_blank" rel="noopener">เปิด ↗</a></div>
  <script>
    // สคริปต์ควบคุมการทำงานของแอดมินพอร์ทัล
    (function() {
      // 1. ซ่อนแบนเนอร์ Give it a try / mobile promo อัตโนมัติทันที
      const hidePromo = () => {
        document.querySelectorAll('.infobar').forEach((bar) => {
          if (bar.textContent.includes('Give it a try') || bar.textContent.includes('available on mobile')) {
            bar.style.setProperty('display', 'none', 'important');
          }
        });
        document.querySelectorAll('[style*="--sui-infobar-message-justify-content"]').forEach((el) => {
          el.style.setProperty('display', 'none', 'important');
        });
      };
      const obs = new MutationObserver(hidePromo);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      hidePromo();

      // แปลเมนูบัญชีมุมขวาบน (Sveltia ไม่มีภาษาไทยในตัว) — ข้อความไม่ตรงในตารางจะถูกปล่อยไว้ตามเดิม
      const TH = {
        'Live Site': 'ดูเว็บไซต์จริง',
        'Settings': 'ตั้งค่า',
        'Keyboard Shortcuts': 'ปุ่มลัดคีย์บอร์ด',
        'Sign In with Mobile': 'เข้าสู่ระบบด้วยมือถือ',
        'Install as App': 'ติดตั้งเป็นแอป',
        'Sign Out': 'ออกจากระบบ',
        'Edit Slug': 'แก้ไขชื่อลิงก์ (Slug)',
        'Revert All Changes': 'ยกเลิกการแก้ไขทั้งหมด',
        'Restore Default': 'คืนค่าเริ่มต้น',
        'Clear All': 'ล้างทั้งหมด',
        'Show Second Pane': 'แสดงหน้าต่างที่สอง',
        'Show Preview': 'แสดงตัวอย่าง',
        'Sync Scrolling': 'เลื่อนหน้าจอพร้อมกัน',
      };
      const translateMenu = () => {
        document.querySelectorAll('[role="menu"]').forEach((menu) => {
          const w = document.createTreeWalker(menu, NodeFilter.SHOW_TEXT);
          for (let n; (n = w.nextNode()); ) {
            const t = n.nodeValue.trim();
            const m = t.match(/^Signed In as (.+)$/);
            const th = m ? 'เข้าสู่ระบบในชื่อ ' + m[1] : TH[t];
            if (th) n.nodeValue = th;
          }
        });
      };
      new MutationObserver(translateMenu).observe(document.documentElement, { childList: true, subtree: true });

      // แสดง URL จริงของ section ที่กำลังแก้ ไว้ด้านบน
      const LIVE = {
        hero_section: '/#home', services_collection: '/#services', equipment_section: '/#equipment',
        gallery_collection: '/#gallery', standards_section: '/#standards', pricing_collection: '/#pricing',
        urgent_hook_collection: '/', faqs_collection: '/#faq', footer_collection: '/#contact',
        page_text_collection: '/', site_settings: '/',
      };
      const liveUrl = document.getElementById('jina-live-url');
      const luInput = liveUrl.querySelector('input');
      const luOpen = liveUrl.querySelector('a');
      liveUrl.querySelector('.lu-host').textContent = location.host;
      let luKey = '';
      const syncOpen = () => { luOpen.href = location.origin + (luInput.value.startsWith('/') ? '' : '/') + luInput.value; };
      // path ที่แก้เอง เก็บในเบราว์เซอร์นี้เท่านั้น (ไม่ใช่ค่าในเว็บ) — ล้างช่องเพื่อกลับค่าเริ่มต้น
      luInput.addEventListener('input', () => {
        try { luInput.value.trim() ? localStorage.setItem(luKey, luInput.value.trim()) : localStorage.removeItem(luKey); } catch (e) {}
        syncOpen();
      });
      const updateLive = () => {
        const m = location.hash.match(/^#\/collections\/([^/]+)\/entries\/([^/?]+)/);
        const path = m && (m[1] === 'blog' ? '/blog/' + m[2] + '/' : LIVE[m[1]]);
        liveUrl.hidden = !path;
        if (!path) return;
        luKey = 'jina-live-' + m[1] + '/' + m[2];
        let saved = null;
        try { saved = localStorage.getItem(luKey); } catch (e) {}
        luInput.value = saved || path;
        syncOpen();
      };
      addEventListener('hashchange', updateLive);
      addEventListener('DOMContentLoaded', updateLive);

    })();
  </script>

  <!-- Sveltia CMS (pinned version) -->
  <script src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js" type="module"></script>
</body>
</html>
