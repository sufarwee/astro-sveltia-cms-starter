  # =====================================================================
  # 9. การตั้งค่าทั่วไป: SEO, Tracking, โลโก้, ข้อมูลติดต่อ, Schema
  # =====================================================================
  - name: 'site_settings'
    label: '⚙️ ตั้งค่าเว็บไซต์, SEO & ติดต่อ'
    delete: false
    files:
      - name: 'general_settings'
        label: 'ข้อมูลเว็บไซต์, SEO, โลโก้, Tracking'
        file: '02-astro-version/src/data/settings.json'
        fields:
          - { label: 'สวิตช์ เปิด/ปิด หน้าบทความ (Blog) ทั้งหมด', name: 'blogEnabled', widget: 'boolean', default: true, hint: 'ปิด (OFF) = ซ่อนเมนูบทความ หน้า /blog/ และบทความทุกเรื่องจากเว็บไซต์ (บทความที่เขียนไว้ยังอยู่ครบในหลังบ้าน)  เปิด (ON) = แสดงเฉพาะบทความที่เปิดสถานะ Published' }
          - { label: '🏷️ หัวข้อหน้าเว็บหลัก (Meta Title)', name: 'siteTitle', widget: 'string', hint: 'ควรยาว 50–60 ตัวอักษร ขึ้นต้นด้วยคำค้นหลัก' }
          - { label: '🏷️ คำอธิบายเว็บไซต์ (Meta Description)', name: 'siteDescription', widget: 'text', hint: 'ควรยาว 120–160 ตัวอักษร' }
          - { label: '🏷️ โดเมนหลักของเว็บ (Canonical URL)', name: 'canonicalUrl', widget: 'string', hint: 'เปลี่ยนที่นี่ที่เดียวเมื่อได้โดเมนจริง เช่น https://jinaservicephuket.com/ แล้วทั้ง canonical, sitemap, robots, schema และ llms.txt จะเปลี่ยนตามอัตโนมัติ' }

          # หมวดที่ 2: โลโก้ และ อัตลักษณ์แบรนด์
          - label: 'โลโก้ (ตัวอักษร) ด้านบนและ Footer ทุกหน้า'
            name: 'logo'
            widget: 'object'
            hint: 'โลโก้เป็นตัวอักษร 2 บรรทัด: ตัวใหญ่ด้านบน และบรรทัดเล็กด้านล่าง (คำสุดท้ายเป็นสีเขียว)'
            fields:
              - { label: 'ตัวใหญ่ (เช่น JINA)', name: 'wordmark', widget: 'string' }
              - { label: 'บรรทัดเล็ก ส่วนแรก (เช่น SERVICE)', name: 'line', widget: 'string' }
              - { label: 'บรรทัดเล็ก คำสีเขียว (เช่น PHUKET)', name: 'highlight', widget: 'string' }
          - label: 'ข้อมูลติดต่อ (แก้ที่นี่ที่เดียว เปลี่ยนทั้งเว็บ)'
            name: 'contact'
            widget: 'object'
            collapsed: true
            hint: 'ใช้กับปุ่มโทร แถบสายด่วน footer หน้าบทความ ข้อมูลที่ Google อ่าน (schema) และ llms.txt'
            fields:
              - { label: 'เบอร์หลัก (รูปแบบ 095-424-1968)', name: 'phoneDisplay', widget: 'string' }
