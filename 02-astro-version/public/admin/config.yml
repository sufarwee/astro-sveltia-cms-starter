backend:
  name: github
  repo: xxxx/xxxx
  branch: main
  base_url: https://xxxx
  auth_endpoint: auth
  commit_messages:
    create: 'CMS: เพิ่ม {{collection}} "{{slug}}"'
    update: 'CMS: อัปเดต {{collection}} "{{slug}}"'
    delete: 'CMS: ลบ {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: อัปโหลดรูป/ไฟล์ "{{path}}"'
    deleteMedia: 'CMS: ลบไฟล์ "{{path}}"'

# โลโก้และชื่อระบบ CMS หลังบ้าน
logo:
  src: '/media/jina-logo-admin.png'
logo_url: '/media/jina-logo-admin.png'
app_title: 'JINA SERVICE PHUKET'

media_folder: '02-astro-version/public/media'
public_folder: '/media'

# Uploads: phone photos are converted in the browser to WebP and scaled to max 1920px.
# Rotation from the camera (EXIF) is baked into the pixels, so images never show sideways/upside down,
# and a 4-5MB iPhone photo becomes ~200-400KB. File names are made URL-safe (no spaces).
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1920
          height: 1920

# Interface language
locale: 'th'

collections:
  # =====================================================================
  # 0. บทความ & สาระน่ารู้ (Blog Posts / Knowledge Base)
  # =====================================================================
  - name: 'home_sections'
    label: '🧩 เปิด/ปิด & เรียงลำดับส่วนต่างๆ ของหน้าแรก'
    description: 'ลากเพื่อสลับลำดับ ปิดสวิตช์เพื่อซ่อนส่วนนั้น (ส่วนหัวเว็บ/ภาพหลัก และท้ายเว็บ อยู่ตำแหน่งเดิมเสมอ)'
    delete: false
    files:
      - name: 'home_sections_data'
        label: 'ลำดับและการแสดงผลแต่ละส่วน'
        file: '02-astro-version/src/data/homeSections.json'
        fields:
          - label: 'ส่วนต่างๆ (ลากเรียงลำดับได้)'
            name: 'sections'
            widget: 'list'
            summary: '{{fields.id}} — {{fields.enabled}}'
            fields:
              - { label: 'ส่วน', name: 'id', widget: 'select', options: [{ label: 'แถบความน่าเชื่อถือ (ใต้ภาพหลัก)', value: 'proof' }, { label: 'บริการของเรา (Our Services)', value: 'services' }, { label: 'อุปกรณ์/เครื่องมือ', value: 'equipment' }, { label: 'แกลเลอรีผลงาน', value: 'gallery' }, { label: 'มาตรฐานการทำงาน', value: 'standards' }, { label: 'ใบอนุญาต & ความเชี่ยวชาญ', value: 'license' }, { label: 'อัตราค่าบริการ', value: 'pricing' }, { label: 'รีวิวลูกค้า', value: 'reviews' }, { label: 'แบนเนอร์สายด่วน 24 ชม.', value: 'hook' }, { label: 'พื้นที่บริการ 17 ตำบล', value: 'coverage' }, { label: 'ฟอร์มติดต่อ/ขอราคา', value: 'contact' }, { label: 'คำถามที่พบบ่อย', value: 'faq' }, { label: 'Facebook / โซเชียล', value: 'social' }] }
              - { label: 'แสดงผล (ON = แสดง / OFF = ซ่อน)', name: 'enabled', widget: 'boolean', default: true }
  - name: 'blog_page'
    label: '📰 จัดการการ์ดหน้าบทความ (หัวข้อหน้า /blog/)'
    description: 'ข้อความส่วนหัวของหน้ารวมบทความ และ SEO ของหน้านั้น'
    delete: false
    files:
      - name: 'blog_page_data'
        label: 'หัวข้อและคำอธิบายหน้ารวมบทความ'
        file: '02-astro-version/src/data/blogPage.json'
        fields:
          - { label: 'ป้ายเล็กด้านบน', name: 'badge', widget: 'string' }
          - { label: 'หัวข้อใหญ่ (ควรสั้น ให้อยู่บรรทัดเดียว)', name: 'title', widget: 'string' }
          - { label: 'คำอธิบายใต้หัวข้อ', name: 'intro', widget: 'text' }
          - { label: 'SEO: Title ของหน้า (แสดงบน Google)', name: 'seoTitle', widget: 'string' }
          - { label: 'SEO: Description ของหน้า', name: 'seoDescription', widget: 'text' }
  - name: 'blog'
    label: 'บทความ & สาระน่ารู้ (Blog Posts)'
    folder: '02-astro-version/src/content/blog'
    create: true
    slug: '{{slug}}'
    summary: '{{title}} [{{pubDate}}] ({{published | ternary("เผยแพร่", "ฉบับร่าง")}})'
    fields:
      - { label: '🔘 สถานะเปิด/ปิดบทความ (Published)', name: 'published', widget: 'boolean', default: false, hint: 'ปิดไว้ (OFF / Draft) หากยังไม่ต้องการให้แสดงบนหน้าเว็บ หรือเปิด (ON) เมื่อพร้อมเผยแพร่' }
      - { label: 'หัวข้อบทความ (Title)', name: 'title', widget: 'string' }
      - { label: 'คำอธิบายย่อ (Description / SEO Meta)', name: 'description', widget: 'text' }
      - { label: 'วันที่เผยแพร่ (Publish Date)', name: 'pubDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 'หมวดหมู่บทความ (Category)', name: 'category', widget: 'select', default: 'ชักโครกตัน & ท่อตัน', options: ['ชักโครกตัน & ท่อตัน', 'การดูแลถังบำบัด', 'ถังดักไขมัน', 'ความรู้เรื่องสุขาภิบาล'] }
      - { label: 'รูปภาพหน้าปกบทความ (Cover Image)', name: 'coverImage', widget: 'image', default: '/media/jina-standard-1.webp' }
      - { label: 'คำอธิบายภาพหน้าปก (Alt Text สำหรับ SEO)', name: 'coverAlt', widget: 'string', default: 'ทีมช่างจินา เซอร์วิส ภูเก็ต' }
      - { label: 'ผู้เขียนบทความ (Author)', name: 'author', widget: 'string', default: 'ทีมช่างเทคนิค จินา เซอร์วิส' }
      - { label: 'ตำแหน่ง / ประสบการณ์ (Author Role / E-E-A-T)', name: 'authorRole', widget: 'string', default: 'ผู้เชี่ยวชาญงานระบบบำบัดและสุขาภิบาล ประสบการณ์ 30 ปี ภูเก็ต' }
      - { label: 'วันที่แก้ไขล่าสุด (ใส่เมื่ออัปเดตเนื้อหา ช่วยเรื่องความสดใหม่ของ SEO)', name: 'updatedDate', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: 'เนื้อหาบทความ (Markdown Body)', name: 'body', widget: 'markdown' }

  # =====================================================================
  # 1. ส่วนหัวเว็บ (Hero) — หน้าแรก ส่วนบนสุด
  # =====================================================================
  - name: 'hero_section'
    label: '1. ส่วนหัวเว็บ & สไลด์ (Hero)'
    description: 'แสดงที่ส่วนบนสุดของหน้าแรก: หัวข้อใหญ่ ปุ่มขอประเมินราคา ป้าย ✓ และภาพพื้นหลังที่เลื่อนอัตโนมัติ • ประวัติการแก้ไขทั้งหมด (ข้อมูลก่อนหน้า): https://github.com/xxxx/xxxx/commits/main/02-astro-version/src/data/hero.json'
    delete: false
    files:
      - name: 'hero_data'
        label: 'ข้อความและภาพสไลด์ Hero'
        file: '02-astro-version/src/data/hero.json'
        fields:
          - label: 'ข้อความเล็กเหนือหัวข้อ (Eyebrow)'
            name: 'eyebrow'
            widget: 'object'
            fields:
              - { label: 'ไทย', name: 'th', widget: 'string' }
              - { label: 'English', name: 'en', widget: 'string' }
          - label: 'หัวข้อหลัก H1 (2 บรรทัด)'
            name: 'heading'
            widget: 'object'
            hint: 'หัวข้อสำคัญที่สุดสำหรับ SEO ควรมีคำค้นหลัก เช่น ดูดส้วม ภูเก็ต'
            fields:
              - { label: 'บรรทัดที่ 1 (ไทย - สีขาว)', name: 'line1Th', widget: 'string' }
              - { label: 'บรรทัดที่ 2 (ไทย - สีเขียว)', name: 'line2Th', widget: 'string' }
              - { label: 'บรรทัดที่ 1 (English)', name: 'line1En', widget: 'string' }
              - { label: 'บรรทัดที่ 2 (English)', name: 'line2En', widget: 'string' }
          - label: 'คำอธิบายใต้หัวข้อ (Lead)'
            name: 'lead'
            widget: 'object'
            fields:
              - { label: 'ไทย', name: 'th', widget: 'text' }
              - { label: 'English', name: 'en', widget: 'text' }
          - label: 'ป้าย ✓ ความน่าเชื่อถือ (Trust Badges)'
            name: 'badges'
            widget: 'list'
            summary: '{{fields.th}}'
            fields:
              - { label: 'ไทย', name: 'th', widget: 'string' }
              - { label: 'English', name: 'en', widget: 'string' }
          - label: '🖼️ ภาพพื้นหลังสไลด์ (ภาพแรก = ภาพที่ขึ้นก่อน)'
            name: 'slides'
            widget: 'list'
            summary: '{{fields.name}}'
            hint: 'ลากเพื่อสลับลำดับได้ ภาพแรกในรายการคือภาพที่แสดงก่อนและมีผลต่อความเร็วเว็บ ใช้ WebP กว้าง 1920px ขนาดไม่เกิน 250KB'
            fields:
              - { label: 'ชื่อเรียกภาพ (ใช้ในหลังบ้านเท่านั้น)', name: 'name', widget: 'string' }
              - { label: 'ไฟล์รูปภาพ', name: 'image', widget: 'image' }
              - { label: 'จุดโฟกัสแนวนอน (เช่น center, 50%, 67%)', name: 'position', widget: 'string', default: 'center', required: false }

  # =====================================================================
  # 2. บริการของเรา (Services)
  # =====================================================================
  - name: 'services_collection'
    label: '2. บริการของเรา (Services)'
    description: 'แสดงที่ส่วน "OUR SERVICES" ถัดจากแถบตัวเลขสถิติ: หัวข้อ คำอธิบาย และการ์ดบริการ • ประวัติการแก้ไขทั้งหมด (ข้อมูลก่อนหน้า): https://github.com/xxxx/xxxx/commits/main/02-astro-version/src/data/services.json'
    delete: false
    files:
      - name: 'services_data'
        label: 'หัวข้อและการ์ดบริการ'
        file: '02-astro-version/src/data/services.json'
        fields:
          - { label: 'หัวข้อหลัก (ไทย)', name: 'headingTh', widget: 'string' }
          - { label: 'หัวข้อหลัก (English) — ควรสั้นให้อยู่บรรทัดเดียว', name: 'headingEn', widget: 'string' }
          - { label: 'คำอธิบายข้างหัวข้อ (ไทย)', name: 'leadTh', widget: 'text' }
          - { label: 'คำอธิบายข้างหัวข้อ (English)', name: 'leadEn', widget: 'text' }
          - label: 'การ์ดบริการ'
            name: 'items'
            widget: 'list'
            summary: '{{fields.title}} — {{fields.price}}'
            hint: 'ลากเพื่อสลับลำดับการ์ดได้'
            fields:
              - { label: 'ชื่อบริการ (ไทย)', name: 'title', widget: 'string' }
              - { label: 'ชื่อบริการ (English)', name: 'titleEn', widget: 'string' }
              - { label: 'คำอธิบาย (ไทย)', name: 'desc', widget: 'text' }
              - { label: 'คำอธิบาย (English)', name: 'descEn', widget: 'text' }
              - { label: 'ราคา (ไทย เช่น เริ่มต้น ฿1,xxx* หรือ ประเมินตามหน้างาน)', name: 'price', widget: 'string' }
              - { label: 'ราคา (English เช่น Start ฿1,xxx* หรือ Site quotation)', name: 'priceEn', widget: 'string' }
          - label: 'กล่องรับประกันใต้การ์ดบริการ (ปุ่มขอประเมินฟรี)'
            name: 'promise'
            widget: 'object'
            collapsed: true
            hint: 'กล่องที่อยู่ใต้การ์ดบริการ ปุ่มจะเปิดแชท Facebook Messenger'
            fields:
              - { label: 'แสดงกล่องนี้', name: 'enabled', widget: 'boolean', default: true }
              - { label: 'หัวข้อ (ไทย)', name: 'titleTh', widget: 'string' }
              - { label: 'หัวข้อ (English)', name: 'titleEn', widget: 'string' }
              - { label: 'ข้อความรอง (ไทย)', name: 'textTh', widget: 'text', hint: 'กด Enter เพื่อขึ้นบรรทัดใหม่ได้' }
              - { label: 'ข้อความรอง (English)', name: 'textEn', widget: 'text', hint: 'กด Enter เพื่อขึ้นบรรทัดใหม่ได้' }
              - { label: 'ข้อความบนปุ่ม (ไทย)', name: 'buttonTh', widget: 'string' }
              - { label: 'ข้อความบนปุ่ม (English)', name: 'buttonEn', widget: 'string' }

  # =====================================================================
  # 3. อุปกรณ์มาตรฐาน (Equipment)
  # =====================================================================
  - name: 'equipment_section'
    label: '3. อุปกรณ์มาตรฐาน (Equipment)'
    description: 'แสดงที่ส่วน "EQUIPMENT & SAFETY" ใต้การ์ดบริการ: หัวข้อ กล่อง ISO และการ์ด ✓ 4 ใบ • ประวัติการแก้ไขทั้งหมด (ข้อมูลก่อนหน้า): https://github.com/xxxx/xxxx/commits/main/02-astro-version/src/data/equipment.json'
    delete: false
    files:
      - name: 'equipment_data'
        label: 'ข้อความส่วนอุปกรณ์'
        file: '02-astro-version/src/data/equipment.json'
        fields:
          - { label: 'หัวข้อ (ไทย)', name: 'headingTh', widget: 'string' }
          - { label: 'หัวข้อ (English)', name: 'headingEn', widget: 'string' }
          - { label: 'ข้อความในกล่อง ISO (ไทย)', name: 'isoNote', widget: 'text' }
          - { label: 'ข้อความในกล่อง ISO (English)', name: 'isoNoteEn', widget: 'text' }
          - label: 'การ์ดอุปกรณ์'
            name: 'items'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'หัวข้อ (ไทย)', name: 'title', widget: 'string' }
              - { label: 'หัวข้อ (English)', name: 'titleEn', widget: 'string' }
              - { label: 'คำอธิบาย (ไทย)', name: 'desc', widget: 'text' }
              - { label: 'คำอธิบาย (English)', name: 'descEn', widget: 'text' }
          - { label: 'หมายเหตุใต้การ์ด (ไทย)', name: 'footnote', widget: 'text' }
          - { label: 'หมายเหตุใต้การ์ด (English)', name: 'footnoteEn', widget: 'text' }

  # =====================================================================
  # 4. แกลเลอรีภาพผลงาน (Gallery)
  # =====================================================================
  - name: 'gallery_collection'
    label: '4. แกลเลอรีภาพผลงาน (Gallery)'
    description: 'แสดงที่ส่วน "JINA SERVICE PORTFOLIO": ภาพสไลด์ แถบภาพย่อ และตัวกรองตามหมวด • ประวัติการแก้ไขทั้งหมด (ข้อมูลก่อนหน้า): https://github.com/xxxx/xxxx/commits/main/02-astro-version/src/data/gallery.json'
    delete: false
    files:
      - name: 'gallery_items'
        label: 'รายการภาพและวิดีโอ'
        file: '02-astro-version/src/data/gallery.json'
        fields:
          - label: 'รายการแกลเลอรี'
            name: 'items'
            widget: 'list'
            summary: '{{fields.th}} ({{fields.category}})'
            hint: 'ลากเพื่อสลับลำดับได้ • ติ๊ก ⭐ ภาพแรก ที่รายการใดก็ได้ ภาพนั้นจะขึ้นเป็นภาพแรกของแกลเลอรีทันที (ถ้าติ๊กหลายภาพ จะเรียงตามลำดับในรายการ)'
            fields:
              - { label: '⭐ ตั้งเป็นภาพแรกของแกลเลอรี', name: 'featured', widget: 'boolean', default: false, required: false }
              - label: 'หมวดหมู่ (ตรงกับปุ่มกรองบนหน้าเว็บ)'
                name: 'category'
                widget: 'select'
                options:
                  - { label: 'รูปรถและอุปกรณ์ (fleet)', value: 'fleet' }
                  - { label: 'สูบสิ่งปฏิกูล & AirAsia (septic)', value: 'septic' }
                  - { label: 'เทศกาลดนตรี EDC (edc)', value: 'edc' }
                  - { label: 'ขุดลอกท่อ & บ่อน้ำเสีย (dredge)', value: 'dredge' }
                  - { label: 'ติดตั้งถังบำบัด (tank)', value: 'tank' }
                  - { label: 'คลิปวิดีโอ (video)', value: 'video' }
              - label: 'ประเภทสื่อ'
                name: 'type'
                widget: 'select'
                default: 'image'
                options:
                  - { label: 'รูปภาพ', value: 'image' }
                  - { label: 'วิดีโอ (.webm / .mp4)', value: 'video' }
              - { label: 'ไฟล์รูปภาพหรือวิดีโอ', name: 'src', widget: 'file' }
              - { label: 'ภาพปกวิดีโอ (เฉพาะวิดีโอ ถ้าไม่ใส่จะใช้ชื่อไฟล์-poster.jpg)', name: 'poster', widget: 'image', required: false }
              - { label: 'คำบรรยายภาพ (ไทย)', name: 'th', widget: 'string' }
              - { label: 'คำบรรยายภาพ (English)', name: 'en', widget: 'string' }
              - { label: 'Alt สำหรับ SEO (ไทย)', name: 'altTh', widget: 'string' }
              - { label: 'Alt สำหรับ SEO (English)', name: 'altEn', widget: 'string' }

  # =====================================================================
  # 5. มาตรฐานการทำงาน (The JINA Standard)
  # =====================================================================
  - name: 'standards_section'
    label: '5. มาตรฐานการทำงาน (JINA Standard)'
    description: 'แสดงที่ส่วน "THE JINA STANDARD": ภาพสไลด์ซ้าย หัวข้อ 2 บรรทัด และขั้นตอน 01–04 • ประวัติการแก้ไขทั้งหมด (ข้อมูลก่อนหน้า): https://github.com/xxxx/xxxx/commits/main/02-astro-version/src/data/standards.json'
    delete: false
    files:
      - name: 'standards_data'
        label: 'ข้อความและภาพมาตรฐาน'
        file: '02-astro-version/src/data/standards.json'
        fields:
          - { label: 'หัวข้อบรรทัด 1 (ไทย)', name: 'line1Th', widget: 'string' }
          - { label: 'หัวข้อบรรทัด 1 (English)', name: 'line1En', widget: 'string' }
          - { label: 'หัวข้อบรรทัด 2 (ไทย)', name: 'line2Th', widget: 'string' }
          - { label: 'หัวข้อบรรทัด 2 (English)', name: 'line2En', widget: 'string' }
          - { label: 'คำอธิบาย (ไทย)', name: 'leadTh', widget: 'text' }
          - { label: 'คำอธิบาย (English)', name: 'leadEn', widget: 'text' }
          - label: 'ขั้นตอนการทำงาน (01, 02, ... เรียงเลขให้อัตโนมัติ)'
            name: 'items'
            widget: 'list'
            summary: '{{fields.title}}'
            fields:
              - { label: 'หัวข้อ (ไทย)', name: 'title', widget: 'string' }
              - { label: 'หัวข้อ (English)', name: 'titleEn', widget: 'string' }
              - { label: 'คำอธิบาย (ไทย)', name: 'desc', widget: 'string' }
              - { label: 'คำอธิบาย (English)', name: 'descEn', widget: 'string' }
          - label: 'ภาพสไลด์ด้านซ้าย'
